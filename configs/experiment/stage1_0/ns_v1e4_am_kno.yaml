experiment: stage1_0_ns_v1e4_am_kno
stage: stage1_0_am_kno
script: experiments/stage1_0/train_am_kno_ns_v1e4.py
dataset: navier_stokes_v1e4
data_env: NS2D_V1E4_FILE
baseline_reference: kno_koopmanlab_ns_v1e4_o32_m16_r8_t20_or_t40_ep500_seed42
default_args:
  epochs: 500
  batch_size: 10
  t_in: 10
  t_out: 20
  ntrain: 1000
  ntest: 200
  operator_size: 32
  decompose: 8
  max_modes: 0
  frequency_basis_dim: 32
  condition_mode: freq
  operator_factorization: factorized
  factorized_rank: 1
  output_scale: 0.02
  lr: 3.0e-4
  max_grad_norm: 1.0
  seed: 42
outputs:
  - metrics.csv
  - rollout_error_by_step.csv
  - spectral_metrics.csv
  - config.yaml
  - env.txt
