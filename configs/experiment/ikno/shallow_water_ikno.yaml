experiment: ikno_shallow_water
stage: ikno_baseline
script: experiments/ikno/train_ikno_shallow_water.py
dataset: shallow_water
data_env: SHALLOW_WATER_FILE
default_args:
  epochs: 500
  batch_size: 5
  t_in: 10
  t_out: 40
  sub: 1
  ntrain: 900
  ntest: 100
  dt: 0.01
  operator_size: 32
  modes: 16
  decompose: 4
  koopman_power: 2
  inn_blocks: 4
  inn_hidden_dim: 128
  lr: 1.0e-3
  step_size: 100
  gamma: 0.5
  seed: 42
  reconstruction_weight: 0.0
outputs:
  - args.json
  - config.yaml
  - env.txt
  - metrics.csv
  - rollout_error_by_step.csv
  - spectral_metrics.csv
  - checkpoint_best.pt
  - checkpoint_last.pt
