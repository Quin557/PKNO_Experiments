experiment: ikno_ns_v1e4
stage: ikno_baseline
script: experiments/ikno/train_ikno_ns_v1e4.py
dataset: navier_stokes_v1e4
data_env: NS2D_V1E4_FILE
default_args:
  epochs: 500
  batch_size: 10
  t_in: 10
  t_out: 40
  sub: 1
  ntrain: 1000
  ntest: 200
  operator_size: 32
  modes: 16
  decompose: 4
  koopman_power: 2
  inn_blocks: 4
  inn_hidden_dim: 128
  lr: 1.0e-3
  step_size: 100
  gamma: 0.5
  seed: 42
  reconstruction_weight: 0.0
outputs:
  - args.json
  - config.yaml
  - env.txt
  - metrics.csv
  - rollout_error_by_step.csv
  - spectral_metrics.csv
  - checkpoint_best.pt
  - checkpoint_last.pt
