model: am_kno
package: src/amkno
stage: stage1_0
status: runnable
base_model: kno
isolation_rule: "AM-KNO is implemented as a standalone candidate package and does not modify src/pkno model code."
operator:
  type: amortized_frequency_generated_koopman
  default_generator: mlp_chebyshev
  default_condition_mode: freq
  default_2d_factorization: factorized
  variants:
    freq: "K_k = G_phi(e(k))"
    factorized_2d: "K_(kx,ky) = combine(Gx_phi(e(kx)), Gy_phi(e(ky)))"
  ablation_variants:
    state_full_2d: "K_k = G_phi(e(k), S_theta(history)); use --operator-factorization full"
    state_static_full_2d: "K_k = G_phi(e(k), S_theta(history), c_static); use --operator-factorization full"
mode_policy:
  default_max_modes: 0
  meaning: "0 means use all FFT modes available at the current grid resolution."
  note: "This is a compute cap, not KNO's per-mode learnable matrix count."
defaults:
  operator_size: 32
  decompose: 8
  frequency_basis_dim: 32
  generator_hidden_dim: 128
  generator_depth: 2
  operator_factorization: factorized
  factorized_rank: 1
  output_scale: 0.05
  use_hf_residual: false
notes:
  - "Default implementation follows AM-FNO's MLP plus orthogonal/Chebyshev basis idea."
  - "Stage1_0 defaults to pure frequency conditioning; current-state conditioning is deferred to later PKNO/Stage3 experiments."
  - "2D defaults use factorized Gx(kx), Gy(ky), closer to AM-FNO MLP and cheaper than full G(kx, ky)."
  - "KAN is not enabled in Stage1_0 by default because it adds a heavy dependency and a separate stability variable."
  - "If AM-KNO proves useful, integration into PKNO should be a later stage, not part of this standalone trial."
